<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 디데이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* Layout: 달력 카드 위로 고양이가 빼꼼, 아래로 남은 날 순 목록. 둥근 모서리와 발바닥 무늬 */
:root {
  color-scheme: light;
  --paper: #fbf3f6;
  --sheet: #ffffff;
  --ink: #3b3340;
  --muted: #8a7f8e;
  --line: #f1dfe7;
  --accent: #ff7aa2;
  --accent-ink: #ffffff;
  --sat: #6f9bf2;
  --warn: #e98a1e;
  --chip: #f6e8ee;
  --cat: #d4a06c;
  --cat-dark: #4a3020;
  --cat-light: #ecd2ad;
  --cat-pink: #e8a497;
  --cat-eye: #b9a23e;
  --cat-shine: #ffffff;
  --cat-tag: #c9d3dc;
  --bee: #f2cf2b;
  --bee-stripe: #2a2420;
  --paw: rgba(255, 122, 162, .10);
  --bed: #ece5da;
  --blanket: #dce8ee;
  --flower-a: #d9a7b8;
  --flower-b: #efd98f;
  --bg-veil: color-mix(in srgb, var(--paper) 38%, transparent);
  --f-display: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --c-birthday: #e8508a;
  --c-anniv: #8a62d6;
  --c-expiry: #e07a12;
  --c-plan: #4a7ee0;
  --c-etc: #8a7f8e;
  --c-cycle: #1a8f80;
  --spot-a: #ff6fa3;
  --spot-b: #ff9a8b;
  --spot-c: #b58cff;
  --spot-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1d1920; --sheet: #28232c; --ink: #f3edf5; --muted: #ab9fb0; --line: #3b3441;
    --accent: #ff8fb3; --accent-ink: #2a1a21; --sat: #8fb0ff; --warn: #f5a447; --chip: #342d39;
    --cat: #d9a874; --cat-light: #efd7b4; --paw: rgba(255, 143, 179, .07);
    --bed: #2b2620; --blanket: #27313a; --flower-a: #6d4a5a; --flower-b: #6a5d33; --bg-veil: color-mix(in srgb, var(--paper) 55%, transparent);
    --c-birthday: #ff7fb0; --c-anniv: #b297ff; --c-expiry: #f5a447; --c-plan: #8fb0ff; --c-etc: #ab9fb0; --c-cycle: #4fd1bf;
    --spot-a: #e0558c; --spot-b: #e8806f; --spot-c: #9a72f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1d1920; --sheet: #28232c; --ink: #f3edf5; --muted: #ab9fb0; --line: #3b3441;
  --accent: #ff8fb3; --accent-ink: #2a1a21; --sat: #8fb0ff; --warn: #f5a447; --chip: #342d39;
  --cat: #d9a874; --cat-light: #efd7b4; --paw: rgba(255, 143, 179, .07);
  --bed: #2b2620; --blanket: #27313a; --flower-a: #6d4a5a; --flower-b: #6a5d33; --bg-veil: color-mix(in srgb, var(--paper) 55%, transparent);
  --c-birthday: #ff7fb0; --c-anniv: #b297ff; --c-expiry: #f5a447; --c-plan: #8fb0ff; --c-etc: #ab9fb0; --c-cycle: #4fd1bf;
  --spot-a: #e0558c; --spot-b: #e8806f; --spot-c: #9a72f0;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background-color: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  background-image: radial-gradient(circle at 20px 20px, var(--paw) 7px, transparent 7.5px),
                    radial-gradient(circle at 10px 8px, var(--paw) 3px, transparent 3.5px),
                    radial-gradient(circle at 20px 4px, var(--paw) 3px, transparent 3.5px),
                    radial-gradient(circle at 30px 8px, var(--paw) 3px, transparent 3.5px);
  background-size: 80px 80px;
}
/* 배경: 꽃무늬 이불 위에 쭉 뻗고 조는 된장색 고양이 그림 */
.bgart { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bgart svg { width: 100%; height: 100%; display: block; }
.bgart::after { content: ""; position: absolute; inset: 0; background: var(--bg-veil); }
h1 { text-shadow: 0 1px 0 var(--paper), 0 0 10px var(--paper); }
/* 오른쪽 위 버튼들 */
.topbtns { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: flex; gap: 6px; }
.theme-btn { display: flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; color: var(--ink); background: var(--sheet); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 10px; cursor: pointer; box-shadow: 0 3px 10px -6px var(--ink); }
.theme-btn .ico { font-size: 17px; line-height: 1; }
.theme-btn:hover { border-color: var(--accent); }
.theme-btn:focus-visible { outline: 2.5px solid var(--sat); outline-offset: 2px; }
@media (max-width: 480px) { .theme-btn .txt { display: none; } .theme-btn { padding: 8px; } .intro { padding-right: 88px; } }
.wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 18px; }

/* 머리: 고양이 + 달력 */
.head { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.catcal { width: 124px; flex: none; position: relative; }
.catcal svg { display: block; width: 124px; height: auto; position: relative; z-index: 1; margin-bottom: -14px; }
.cat-fur { fill: var(--cat); }
.cat-in { fill: var(--cat-pink); }
.cat-line { fill: none; stroke: var(--cat-dark); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.cat-eye { fill: var(--cat-dark); }
.cat-eyeball { fill: var(--cat-eye); stroke: var(--cat-dark); stroke-width: 1.6; }
.cat-shine { fill: var(--cat-shine); }
.cat-muzzle { fill: var(--cat-light); }
.cat-stripe { fill: none; stroke: var(--cat-dark); stroke-width: 2.6; stroke-linecap: round; opacity: .28; }
.cat-tag { fill: var(--cat-tag); stroke: var(--cat-dark); stroke-width: 1.2; }
.cat-blush { fill: var(--cat-pink); opacity: .7; }
.cat-paw { fill: var(--cat); stroke: var(--cat-dark); stroke-width: 1.6; }
.card { background: var(--sheet); border: 2px solid var(--line); border-radius: 18px; text-align: center; padding: 18px 0 8px; }
.card .ym { font-size: 13px; color: var(--muted); }
.card .d { font-family: var(--f-display); font-size: 50px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.card .w { font-size: 13px; color: var(--muted); }
.card .sun { color: var(--accent); } .card .sat { color: var(--sat); }
.intro { flex: 1; min-width: 210px; display: grid; gap: 6px; padding-bottom: 6px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 .nyang { color: var(--accent); }
.summary { display: flex; flex-wrap: wrap; gap: 6px; }
.summary span { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 400; font-family: var(--f-display); font-size: 15px; }
.summary .hot { border-color: var(--accent); }
.summary .hot b { color: var(--accent); }

/* 특별한 날 */
.spot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.spot-card { position: relative; overflow: hidden; aspect-ratio: 1 / 1; border-radius: 22px; padding: 14px 14px 12px; display: flex; flex-direction: column; color: var(--spot-ink); background: linear-gradient(135deg, var(--spot-a), var(--spot-b) 55%, var(--spot-c)); cursor: pointer; box-shadow: 0 10px 24px -14px var(--spot-a); }
.spot-card > :not(.fx) { position: relative; }
.spot-card .eyebrow { font-size: 12px; opacity: .92; }
.spot-card .st { font-family: var(--f-display); font-size: 17px; line-height: 1.25; margin-top: 2px; overflow-wrap: anywhere; }
.spot-card .sbig { font-family: var(--f-display); font-size: clamp(34px, 10vw, 50px); line-height: 1; margin-top: auto; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0, 0, 0, .08); white-space: nowrap; }
.spot-card .live { font-variant-numeric: tabular-nums; font-size: 12.5px; min-height: 1.4em; margin-top: 4px; }
.spot-card .ssub { font-size: 11.5px; opacity: .9; margin-top: 2px; line-height: 1.35; }
.fx { position: absolute; inset: 0; pointer-events: none; }
.fx span { position: absolute; bottom: -24px; color: var(--spot-ink); opacity: 0; animation: floatUp 7s linear infinite; }
@keyframes floatUp {
  0% { transform: translateY(0) scale(.8); opacity: 0; }
  15% { opacity: .55; }
  100% { transform: translateY(-260px) rotate(24deg) scale(1.15); opacity: 0; }
}
.party .fx span { animation-duration: 3.2s; }
@media (prefers-reduced-motion: reduce) { .fx span { animation: none; opacity: .3; bottom: auto; top: 40%; } }
.row.fancy { background: color-mix(in srgb, var(--spot-a) 7%, transparent); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 15px; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.check small { display: block; color: var(--muted); font-size: 12px; }

/* 도구줄 */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font: inherit; font-size: 14px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); padding: 4px 13px; border-radius: 999px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.filters button .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.filters button[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.add { font-family: var(--f-display); font-size: 17px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, var(--ink)); }
.add:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, var(--ink)); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row:focus-visible, summary:focus-visible { outline: 2.5px solid var(--sat); outline-offset: 2px; }

/* 목록 */
.list { background: var(--sheet); border: 2px solid var(--line); border-radius: 22px; overflow: hidden; }
.row { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; padding: 12px 18px; border-top: 2px dashed var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--chip) 60%, transparent); }
.dd { font-family: var(--f-display); font-size: 27px; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dd small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); margin-top: 3px; }
.dd.today { color: var(--accent); }
.dd.soon { color: var(--warn); }
.dd.past { color: var(--muted); }
.info { min-width: 0; }
.info .t { font-size: 16px; overflow-wrap: anywhere; }
.info .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, currentColor 13%, transparent); }
.k-birthday { color: var(--c-birthday); } .k-anniv { color: var(--c-anniv); } .k-expiry { color: var(--c-expiry); }
.k-plan { color: var(--c-plan); } .k-etc { color: var(--c-etc); } .k-cycle { color: var(--c-cycle); }
.row.expired .info .t { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
.empty { padding: 28px 20px 32px; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 4px; }
.empty svg { width: 116px; height: auto; margin-bottom: 4px; }
.empty strong { color: var(--ink); font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.demo { background: var(--sheet); border: 2px dashed var(--accent); border-radius: 16px; padding: 10px 14px; font-size: 13px; }
.demo b { color: var(--accent); font-weight: 400; font-family: var(--f-display); font-size: 15px; }

/* 지운 항목 */
.trash { background: var(--sheet); border: 2px solid var(--line); border-radius: 18px; padding: 4px 16px; font-size: 14px; }
.trash summary { cursor: pointer; padding: 8px 0; color: var(--muted); }
.trash ul { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.trash li { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.trash li span { min-width: 0; overflow-wrap: anywhere; }
.trash li small { color: var(--muted); }

/* 편집 창 */
.veil { position: fixed; inset: 0; background: rgba(30, 20, 30, .45); display: grid; place-items: center; padding: 16px; z-index: 10; }
.panel { background: var(--sheet); color: var(--ink); border-radius: 22px; width: 100%; max-width: 440px; max-height: 100%; overflow: auto; padding: 22px; display: grid; gap: 14px; }
.panel h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; }
.kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kinds label { text-align: center; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 0; cursor: pointer; font-size: 14px; position: relative; }
.kinds input { position: absolute; opacity: 0; pointer-events: none; }
.kinds label:has(input:checked) { border-color: currentColor; background: color-mix(in srgb, currentColor 12%, transparent); }
.kinds label:has(input:focus-visible) { outline: 2.5px solid var(--sat); outline-offset: 2px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 100%; }
.field textarea { resize: vertical; min-height: 60px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.actions .right { display: flex; gap: 8px; margin-left: auto; }
.btn { font: inherit; border-radius: 999px; padding: 8px 18px; cursor: pointer; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.btn.small { padding: 4px 12px; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--f-display); font-size: 16px; }
.btn.danger { color: var(--accent); border-color: var(--accent); background: transparent; }
#lockVeil { z-index: 15; }
.field > label > span { font-size: 13px; color: var(--muted); }
.pwrow { display: flex; gap: 8px; align-items: center; }
.pwrow input { flex: 1; min-width: 0; }
.pwrow .btn { white-space: nowrap; }
.err { color: var(--accent); font-size: 13px; margin: 0; min-height: 1.2em; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 18px; border-radius: 999px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 480px) {
  .row { grid-template-columns: 80px 1fr; padding: 12px 14px; }
  .row .pill { grid-column: 2; justify-self: start; }
  .dd { font-size: 23px; }
  h1 { font-size: 29px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="topbtns">
  <button class="theme-btn" id="lockBtn" type="button"><span class="ico" aria-hidden="true">🔒</span><span class="txt">잠김</span></button>
  <button class="theme-btn" id="themeBtn" type="button"><span class="ico" aria-hidden="true">🌙</span><span class="txt">어둡게</span></button>
</div>
<div class="bgart" aria-hidden="true">
  <svg viewBox="0 0 1000 750" preserveAspectRatio="xMinYMid slice">
    <defs>
      <pattern id="flowers" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
        <g fill="var(--flower-a)" opacity=".75">
          <circle cx="20" cy="20" r="6"/><circle cx="31" cy="20" r="6"/><circle cx="25.5" cy="11" r="6"/><circle cx="25.5" cy="29" r="6"/>
        </g>
        <circle cx="25.5" cy="20" r="3.5" fill="var(--flower-b)"/>
        <g fill="var(--flower-b)" opacity=".8">
          <circle cx="62" cy="62" r="5"/><circle cx="71" cy="62" r="5"/><circle cx="66.5" cy="55" r="5"/><circle cx="66.5" cy="69" r="5"/>
        </g>
        <path d="M40 48 q10 -8 18 0 M8 70 q8 6 16 0" stroke="var(--flower-a)" stroke-width="2.5" fill="none" opacity=".6" stroke-linecap="round"/>
      </pattern>
    </defs>
    <rect width="1000" height="750" fill="var(--bed)"/>
    <path d="M0 0 H700 C680 130 540 210 360 270 C220 315 90 390 0 450 Z" fill="var(--blanket)"/>
    <path d="M0 0 H700 C680 130 540 210 360 270 C220 315 90 390 0 450 Z" fill="url(#flowers)"/>
    <path d="M700 0 C680 130 540 210 360 270 C220 315 90 390 0 450" stroke="var(--cat-dark)" stroke-width="3" fill="none" opacity=".08"/>
    <ellipse cx="640" cy="560" rx="460" ry="70" fill="var(--cat-dark)" opacity=".08"/>
    <path class="cat-fur" d="M290 340 C330 205 560 120 770 105 C900 96 1010 125 1040 190 L1040 570 C900 610 700 590 560 548 C430 510 305 455 290 340 Z"/>
    <path class="cat-stripe" d="M520 170 q30 60 10 130 M600 140 q35 70 15 160 M690 122 q35 80 20 180 M780 112 q30 90 18 200 M870 112 q25 95 15 210 M955 125 q20 90 10 210"/>

    <path d="M500 520 L345 715" stroke="var(--cat)" stroke-width="90" stroke-linecap="round"/>
    <path class="cat-stripe" d="M300 520 q22 22 44 28 M255 565 q22 22 44 28 M210 610 q22 22 44 28 M455 585 q24 18 48 22 M420 630 q24 18 48 22 M390 672 q22 16 44 20"/>
    <ellipse class="cat-paw" cx="150" cy="690" rx="50" ry="38" transform="rotate(-45 150 690)"/>

    <path class="cat-line" d="M118 690 q8 10 20 12 M140 712 q8 8 18 8 M306 718 q10 10 22 10 M330 742 q10 6 20 4" stroke-width="2.4" opacity=".55"/>
    <g transform="rotate(-12 270 430)">
      <ellipse cx="278" cy="440" rx="160" ry="130" fill="var(--cat-dark)" opacity=".13"/>
      <path class="cat-fur" d="M145 360 C128 270 160 250 232 300 Z" stroke="var(--cat-dark)" stroke-opacity=".25" stroke-width="3" stroke-linejoin="round"/>
      <path class="cat-fur" d="M308 300 C380 250 412 270 395 360 Z" stroke="var(--cat-dark)" stroke-opacity=".25" stroke-width="3" stroke-linejoin="round"/>
      <path class="cat-in" d="M162 345 C152 288 172 276 214 306 Z"/>
      <path class="cat-in" d="M326 306 C368 276 388 288 378 345 Z"/>
      <ellipse class="cat-fur" cx="270" cy="430" rx="160" ry="130" stroke="var(--cat-dark)" stroke-opacity=".25" stroke-width="3"/>
      <path class="cat-stripe" d="M270 312 v26 M246 318 l5 22 M294 318 l-5 22"/>
      <path class="cat-line" d="M192 440 Q218 464 244 440 M296 440 Q322 464 348 440" stroke-width="6"/>
      <ellipse class="cat-blush" cx="182" cy="478" rx="24" ry="13"/>
      <ellipse class="cat-blush" cx="358" cy="478" rx="24" ry="13"/>
      <ellipse class="cat-muzzle" cx="255" cy="485" rx="21" ry="16"/>
      <ellipse class="cat-muzzle" cx="285" cy="485" rx="21" ry="16"/>

      <path class="cat-line" d="M270 478 v6 M270 484 q-7 8 -14 3 M270 484 q7 8 14 3" stroke-width="3"/>
      <path d="M232 484 l-52 -8 M232 492 l-50 6 M308 484 l52 -8 M308 492 l50 6" stroke="var(--cat-dark)" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"/>
      <path class="cat-line" d="M270 540 v10" stroke-width="2"/>
      <circle class="cat-tag" cx="270" cy="560" r="11"/>
    </g>
  </svg>
</div>
<div class="wrap">
  <header class="head">

// ---------------------------------------------------------------------
// 저장소: Firebase Realtime Database, 설정이 없으면 체험 모드(localStorage)
// 목록은 v/<열쇠>/ 아래에 있다. 열쇠 = SHA-256("dday-samkong:" + 비밀번호) 라서
// 비밀번호를 모르면 목록 위치도 모르고, 서버 규칙도 그 열쇠로만 읽기를 허락한다.
// 쓰기마다 proof/<id> 에 비밀번호를 같이 보내고, 서버 규칙이 맞는지 확인한다.
// ---------------------------------------------------------------------
const hasConfig = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
let pw = lsGet("dday-pw");

async function keyOf(p) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("dday-samkong:" + p));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

const store = hasConfig ? firebaseStore() : demoStore();

function firebaseStore() {
  firebase.initializeApp(FIREBASE_CONFIG);
  const rdb = firebase.database();
  let key = null, refs = [];
  const rows = (s) => Object.entries(s.val() || {}).map(([id, d]) => ({ id, ...d }));
  return {
    newId: () => rdb.ref("events").push().key,
    async listen(p, onItems, onTrash, onError) {
      this.stop();
      key = await keyOf(p);
      refs = [rdb.ref(`v/${key}/events`), rdb.ref(`v/${key}/trash`)];
      refs[0].on("value", (s) => onItems(rows(s)), onError);
      refs[1].on("value", (s) => onTrash(rows(s)), onError);
    },
    stop() { refs.forEach((r) => r.off()); refs = []; key = null; },
    async check(p) { await rdb.ref(`v/${await keyOf(p)}/events`).limitToFirst(1).get(); },
    write(updates) {
      const out = {};
      for (const [path, val] of Object.entries(updates)) {
        out[/^(events|trash)\//.test(path) ? `v/${key}/${path}` : path] = val;
      }
      return rdb.ref().update(out);
    },
  };
}

function demoStore() {
  const KEY = "dday-demo";
  let db;
  try { db = JSON.parse(lsGet(KEY) || "null"); } catch { db = null; }
  if (!db) db = { events: demoSeed(), trash: {} };
  let listeners = null;
  const emit = () => {
    lsSet(KEY, JSON.stringify(db));
    if (!listeners) return;
    listeners[0](Object.entries(db.events).map(([id, d]) => ({ id, ...d })));
    listeners[1](Object.entries(db.trash).map(([id, d]) => ({ id, ...d })));
  };
  return {
    newId: () => "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    async listen(p, onItems, onTrash) { listeners = [onItems, onTrash]; setTimeout(emit, 0); },
    stop() { listeners = null; },
    check: async (p) => { if (!p) throw new Error("empty"); },
    async write(updates) {
      for (const [path, val] of Object.entries(updates)) {
        const [root, id] = path.split("/");
        if (root === "proof") continue;
        if (val === null) delete db[root][id]; else db[root][id] = val;
      }
      emit();
    },
  };
}

function demoSeed() {
  const t = today();
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const plus = (n) => ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() + n));
  const base = { place: "", memo: "", fancy: false, updatedAt: new Date().toISOString() };
  return {
    s1: { ...base, kind: "expiry", title: "우유 (예시)", date: plus(2), place: "냉장" },
    s2: { ...base, kind: "birthday", title: "삼콩이 생일 (예시)", date: ymd(new Date(t.getFullYear() - 3, t.getMonth(), t.getDate() + 40)), fancy: true },
    s3: { ...base, kind: "anniv", title: "사귄 날 (예시)", date: plus(-310), fancy: true },
    s4: { ...base, kind: "cycle", title: "영양제 (예시)", date: plus(-5), on: 21, off: 7 },
    s5: { ...base, kind: "plan", title: "마라톤 (예시)", date: plus(9), memo: "오전 8시" },
  };
}

// ---------------------------------------------------------------------
// 날짜 계산
// ---------------------------------------------------------------------
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function parse(s) { const [y, m, d] = String(s).split("-").map(Number); return y && m && d ? new Date(y, m - 1, d) : null; }
function diff(a, b) { return Math.round((b - a) / DAY); }
function fmt(d) { return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} (${WEEK[d.getDay()]})`; }
function ddLabel(n) { return n === 0 ? "D-Day" : n > 0 ? `D-${n}` : `D+${-n}`; }
function onYear(base, y) {
  const m = base.getMonth(), d = base.getDate();
  const last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(d, last));
}

function compute(it, t) {
  const base = parse(it.date);
  if (!base) return null;
  if (it.kind === "birthday") {
    let next = onYear(base, t.getFullYear());
    if (next < t) next = onYear(base, t.getFullYear() + 1);
    const n = diff(t, next);
    const age = next.getFullYear() - base.getFullYear();
    return { key: n, big: ddLabel(n), small: n === 0 ? "오늘 생일!" : `${next.getMonth() + 1}월 ${next.getDate()}일`,
      sub: `${fmt(next)} · 만 ${age}살이 돼요`, state: n === 0 ? "today" : n <= 7 ? "soon" : "", target: next,
      party: "생일 축하해요! 🎂" };
  }
  if (it.kind === "anniv") {
    const days = diff(base, t) + 1;
    if (days < 1) {
      const n = diff(t, base);
      return { key: n, big: ddLabel(n), small: "시작 전", sub: `${fmt(base)}에 시작`, state: n <= 7 ? "soon" : "" };
    }
    const next100 = Math.floor(days / 100) * 100 + 100;
    const d100 = new Date(base.getFullYear(), base.getMonth(), base.getDate() + next100 - 1);
    let yrs = t.getFullYear() - base.getFullYear();
    let dY = onYear(base, base.getFullYear() + yrs);
    if (dY <= t) { yrs += 1; dY = onYear(base, base.getFullYear() + yrs); }
    const n100 = diff(t, d100);
    const nY = diff(t, dY);
    const nextTxt = n100 <= nY ? `${next100}일까지 ${ddLabel(n100)}` : `${yrs}주년까지 ${ddLabel(nY)}`;
    const isToday = days % 100 === 0 || (t.getMonth() === base.getMonth() && t.getDate() === base.getDate() && days > 1);
    return { key: Math.min(n100, nY), big: `${days.toLocaleString()}일`, small: isToday ? "오늘이 기념일!" : "째",
      sub: `${fmt(base)}부터 · ${nextTxt}`, state: isToday ? "today" : "", target: n100 <= nY ? d100 : dY,
      party: "축하해요! 💐" };
  }
  if (it.kind === "cycle") {
    const on = Math.max(1, Math.round(Number(it.on) || 21)), off = Math.max(0, Math.round(Number(it.off) || 0));
    const len = on + off, d = diff(base, t);
    const rule = `${on}일 먹고 ${off}일 쉬기`;
    if (d < 0) return { key: -d, big: ddLabel(-d), small: "먹기 시작까지", sub: `${fmt(base)} 시작 · ${rule}`, state: -d <= 1 ? "soon" : "" };
    const pos = d % len, round = Math.floor(d / len) + 1;
    const at = (k) => new Date(t.getFullYear(), t.getMonth(), t.getDate() + k);
    if (pos < on) {
      const left = on - pos;
      const nextTxt = off ? `${fmt(at(left))}부터 쉬어요 (${ddLabel(left)})` : "계속 먹어요";
      return { key: left, big: `${pos + 1}/${on}`, small: pos === 0 ? "오늘부터 먹기 시작" : left === 1 ? "오늘이 마지막 날" : "먹는 중",
        sub: `${round}번째 주기 · ${nextTxt}`, state: pos === 0 || left === 1 ? "today" : "" };
    }
    const offDay = pos - on + 1, left = len - pos;
    return { key: left, big: `쉼 ${offDay}/${off}`, small: left === 1 ? "내일부터 다시 먹어요" : "쉬는 중",
      sub: `${round}번째 주기 · ${fmt(at(left))}부터 다시 먹어요 (${ddLabel(left)})`, state: left === 1 ? "soon" : "past" };
  }
  const n = diff(t, base);
  if (it.kind === "expiry") {
    const place = it.place ? `${it.place} · ` : "";
    if (n < 0) return { key: n, big: ddLabel(n), small: `${-n}일 지남`, sub: `${place}${fmt(base)}까지였어요`, state: "today", expired: true };
    return { key: n, big: ddLabel(n), small: n === 0 ? "오늘까지" : n === 1 ? "내일까지" : `${n}일 남음`,
      sub: `${place}${fmt(base)}까지`, state: n <= 1 ? "today" : n <= 3 ? "soon" : "" };
  }
  return { key: n, big: ddLabel(n), small: n < 0 ? `${-n}일 지남` : n === 0 ? "오늘" : `${n}일 남음`,
    sub: fmt(base), state: n === 0 ? "today" : n < 0 ? "past" : n <= 3 ? "soon" : "", target: n > 0 ? base : null,
    party: "오늘이에요! 🎉" };
}

  spot.hidden = !fav.length;
  spot.replaceChildren(...fav.map(({ it, c }) => {
    const isToday = c.state === "today" && c.key === 0;
    const card = document.createElement("div");
    card.className = "spot-card" + (isToday ? " party" : "");
    card.tabIndex = 0; card.setAttribute("role", "button");
    const fx = document.createElement("div"); fx.className = "fx"; fx.setAttribute("aria-hidden", "true");
    const glyphs = isToday ? ["🎉", "✦", "♥", "🎂", "✧", "♥"] : ["♥", "✦", "♥", "✧", "♥"];
    for (let i = 0; i < 8; i++) {
      const h = document.createElement("span");
      h.textContent = glyphs[i % glyphs.length];
      h.style.left = (4 + i * 12) + "%";
      h.style.animationDelay = (i * 0.9) + "s";
      h.style.fontSize = (10 + (i * 5) % 10) + "px";
      fx.append(h);
    }
    const eb = document.createElement("div"); eb.className = "eyebrow"; eb.textContent = isToday ? "🎉 바로 오늘!" : "💖 두근두근";
    const st = document.createElement("div"); st.className = "st"; st.textContent = it.title;
    const big = document.createElement("div"); big.className = "sbig"; big.textContent = c.big;
    const live = document.createElement("div"); live.className = "live";
    if (isToday) live.textContent = c.party || "";
    else if (c.target) live.dataset.target = String(c.target.getTime());
    const sub = document.createElement("div"); sub.className = "ssub"; sub.textContent = c.sub + (it.memo ? ` · ${it.memo}` : "");
    card.append(fx, eb, st, big, live, sub);
    card.onclick = () => edit(it);
    card.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); edit(it); } };
    return card;
  }));
  tick();
}
function tick() {
  for (const e of document.querySelectorAll(".live[data-target]")) {
    const ms = Math.max(0, Number(e.dataset.target) - Date.now());
    const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
    e.textContent = `${d}일 ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")} 남음`;
  }
}

function renderFilters() {
  const counts = { all: items.length };
  for (const it of items) counts[it.kind] = (counts[it.kind] || 0) + 1;
  $("filters").replaceChildren(...["all", ...Object.keys(KINDS)].map((k) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(filter === k));
    b.append(k === "all" ? "전체" : KINDS[k].label);
    const n = document.createElement("span"); n.className = "n"; n.textContent = counts[k] || 0; b.append(n);
    b.onclick = () => { filter = k; render(); };
    return b;
  }));
}

function renderTrash() {
  const recent = trash.slice().sort((a, b) => String(b.deletedAt).localeCompare(String(a.deletedAt))).slice(0, 30);
  $("trashBox").hidden = !recent.length;
  $("trashSum").textContent = `최근 지운 항목 (${recent.length})`;
  $("trashList").replaceChildren(...recent.map((x) => {
    const li = document.createElement("li");
    const sp = document.createElement("span");
    sp.textContent = `${x.title} `;
    const sm = document.createElement("small"); sm.textContent = `${KINDS[x.kind]?.label || "기타"} · ${x.date}`; sp.append(sm);
    const b = document.createElement("button"); b.type = "button"; b.className = "btn small"; b.textContent = "되살리기";
    b.onclick = () => restore(x);
    li.append(sp, b); return li;
  }));
}

function render() {
  renderHead();
  renderFilters();
  const t = today();
  const rows = items.map((it) => ({ it, c: compute(it, t) })).filter((r) => r.c);
  const dday = rows.filter((r) => r.c.state === "today" && !r.c.expired).length;
  const soonExp = rows.filter((r) => r.it.kind === "expiry" && r.c.key >= 0 && r.c.key <= 3).length;
  const expired = rows.filter((r) => r.c.expired).length;
  const s = $("summary"); s.replaceChildren();
  const part = (txt, n) => { const sp = document.createElement("span"); if (n) sp.className = "hot"; const b = document.createElement("b"); b.textContent = n; sp.append(txt + " ", b); s.append(sp); };
  part("오늘", dday);
  part("유통기한 임박", soonExp);
  part("지남", expired);
  renderSpot(rows);
  renderTrash();

  const list = $("list");
  if (viewLocked()) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = SLEEPY_CAT;
    const st = document.createElement("strong"); st.textContent = "가족만 볼 수 있다냥";
    const b = document.createElement("button"); b.type = "button"; b.className = "add"; b.textContent = "🔑 비밀번호 넣기";
    b.onclick = () => needUnlock(() => {});
    e.append(st, "가족 비밀번호를 넣으면 목록이 보여요. 한 번 넣으면 이 기기에서는 기억해요.", b);
    list.replaceChildren(e); return;
  }
  if (!ready) return;
  const shown = rows.filter((r) => filter === "all" || r.it.kind === filter).sort((a, b) => a.c.key - b.c.key);
  if (!shown.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = SLEEPY_CAT;
    const st = document.createElement("strong");
    st.textContent = items.length ? `${KINDS[filter]?.label || ""} 항목이 없다냥` : "아직 아무것도 없다냥";
    e.append(st, "‘+ 추가하기’를 눌러 생일, 기념일, 우유 유통기한 같은 걸 넣어보세요.");
    list.replaceChildren(e); return;
  }
  list.replaceChildren(...shown.map(({ it, c }) => {
    const row = document.createElement("div");
    row.className = "row" + (c.expired ? " expired" : "") + (it.fancy ? " fancy" : "");
    row.tabIndex = 0; row.setAttribute("role", "button");
    const dd = document.createElement("div"); dd.className = "dd " + (c.state || "");
    dd.textContent = c.big; const sm = document.createElement("small"); sm.textContent = c.small; dd.append(sm);
    const info = document.createElement("div"); info.className = "info";
    const ti = document.createElement("div"); ti.className = "t"; ti.textContent = (it.fancy ? "💖 " : "") + it.title;
    const su = document.createElement("div"); su.className = "s"; su.textContent = c.sub + (it.memo ? ` · ${it.memo}` : "");
    info.append(ti, su);
    const pill = document.createElement("span"); pill.className = "pill k-" + it.kind; pill.textContent = KINDS[it.kind]?.label || "기타";
    row.append(dd, info, pill);
    row.setAttribute("aria-label", `${it.title}, ${c.big}, ${c.small}. 눌러서 고치기`);
    row.onclick = () => edit(it);
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); edit(it); } };
    return row;
  }));
}

// ---------------------------------------------------------------------
// 가족 비밀번호
// ---------------------------------------------------------------------
let afterUnlock = null;
function paintLock() {
  const b = $("lockBtn");
  b.querySelector(".ico").textContent = pw ? "🔓" : "🔒";
  b.querySelector(".txt").textContent = pw ? "편집 가능" : "잠김";
  b.setAttribute("aria-label", pw ? "편집 잠그기" : "가족 비밀번호 넣기");
}
function needUnlock(then) {
  if (pw) { then(); return; }
  afterUnlock = then;
  $("f-pw").value = ""; $("pwErr").textContent = "";
  $("f-pw").type = "text"; $("pwShow").textContent = "🙈 숨기기";
  $("lockVeil").hidden = false; $("f-pw").focus();
}
$("lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = $("f-pw").value.trim();
  if (!p) { $("pwErr").textContent = "비밀번호를 넣어주세요."; return; }
  $("lockOk").disabled = true;
  try {
    await store.check(p);
    pw = p; lsSet("dday-pw", p); paintLock();
    $("lockVeil").hidden = true; toast("열렸다냥!");
    startListening();
    const f = afterUnlock; afterUnlock = null; if (f) f();
  } catch { $("pwErr").textContent = "비밀번호가 틀렸어요. 다시 넣어주세요."; }
  finally { $("lockOk").disabled = false; }
});
$("pwShow").onclick = () => {
  const show = $("f-pw").type === "password";
  $("f-pw").type = show ? "text" : "password";
  $("pwShow").textContent = show ? "🙈 숨기기" : "👁 보기";
  $("pwShow").setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보이기");
  $("f-pw").focus();
};
$("lockCancel").onclick = () => { $("lockVeil").hidden = true; afterUnlock = null; };
$("lockBtn").onclick = () => {
  if (pw) { pw = null; lsSet("dday-pw", null); paintLock(); showLocked(); toast("이 기기에서 잠갔어요"); }
  else needUnlock(() => {});
};
function lockedOut() {      // 서버가 비밀번호를 거절함 (비밀번호가 바뀐 경우 등)
  pw = null; lsSet("dday-pw", null); paintLock(); showLocked();
  toast("비밀번호가 맞지 않아요. 다시 넣어주세요.");
}
function startListening() {
  store.listen(pw,
    (list) => { items = list; ready = true; render(); },
    (list) => { trash = list; render(); },
    () => lockedOut());
}
function showLocked() { store.stop(); items = []; trash = []; ready = true; render(); }
const viewLocked = () => hasConfig && !pw;

// ---------------------------------------------------------------------
// 편집 창
// ---------------------------------------------------------------------
function edit(it) { needUnlock(() => openForm(it)); }
function buildKinds() {
  $("kinds").replaceChildren(...Object.entries(KINDS).map(([k, v]) => {
    const l = document.createElement("label"); l.className = "k-" + k;
    const r = document.createElement("input"); r.type = "radio"; r.name = "kind"; r.value = k; r.id = "kind-" + k;
    r.onchange = applyKind;
    const sp = document.createElement("span"); sp.textContent = v.label;
    l.append(r, sp); return l;
  }));
}
function currentKind() { return document.querySelector('input[name="kind"]:checked')?.value || "plan"; }
function applyKind() {
  const k = KINDS[currentKind()];
  $("titleLabel").textContent = k.title; $("dateLabel").textContent = k.date; $("kindHint").textContent = k.hint;
  $("placeWrap").hidden = currentKind() !== "expiry";
  $("cycleWrap").hidden = currentKind() !== "cycle";
}
function openForm(it) {
  editing = it ? it.id : null; pendingDel = false;
  $("formTitle").textContent = it ? "디데이 고치기" : "새 디데이";
  const kind = it ? it.kind : (filter !== "all" ? filter : "expiry");
  $("kind-" + kind).checked = true;
  $("f-title").value = it?.title || "";
  $("f-date").value = it?.date || "";
  $("f-place").value = it?.place || "";
  $("f-memo").value = it?.memo || "";
  $("f-fancy").checked = !!it?.fancy;
  $("f-on").value = it?.on ?? 21;
  $("f-off").value = it?.off ?? 7;
  $("delBtn").hidden = !it; $("delBtn").textContent = "지우기";
  applyKind();
  $("veil").hidden = false;
  $("f-title").focus();
}
function closeForm() { $("veil").hidden = true; editing = null; }

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600);
}
function failed(err) {
  if (String(err?.code || err?.message || "").toLowerCase().includes("permission")) lockedOut();
  else toast("저장하지 못했어요. 인터넷 연결을 확인하고 다시 해보세요.");
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!pw) { needUnlock(() => $("form").requestSubmit()); return; }
  const title = $("f-title").value.trim(), date = $("f-date").value;
  if (!title) { $("f-title").focus(); toast("이름을 적어주세요."); return; }
  if (!parse(date)) { $("f-date").focus(); toast("날짜를 골라주세요."); return; }
  const kind = currentKind();
  const body = { kind, title, date, place: kind === "expiry" ? $("f-place").value : "", memo: $("f-memo").value.trim(), fancy: $("f-fancy").checked, updatedAt: new Date().toISOString() };
  if (kind === "cycle") {
    const on = Math.round(Number($("f-on").value)), off = Math.round(Number($("f-off").value));
    if (!(on >= 1)) { $("f-on").focus(); toast("먹는 날 수를 1 이상으로 적어주세요."); return; }
    if (!(off >= 0)) { $("f-off").focus(); toast("쉬는 날 수를 0 이상으로 적어주세요."); return; }
    body.on = on; body.off = off;
  }
  const id = editing || store.newId();
  $("saveBtn").disabled = true;
  try {
    await store.write({ ["events/" + id]: body, ["proof/" + id]: pw });
    closeForm(); toast("저장했다냥!");
  } catch (err) { failed(err); }
  finally { $("saveBtn").disabled = false; }
});
$("delBtn").onclick = async () => {
  if (!pendingDel) { pendingDel = true; $("delBtn").textContent = "정말 지울까요?"; return; }
  if (!pw) { needUnlock(() => $("delBtn").onclick()); return; }
  const id = editing;
  const it = items.find((x) => x.id === id);
  if (!it) { closeForm(); return; }
  const { id: _, ...data } = it;
  try {
    await store.write({ ["events/" + id]: null, ["trash/" + id]: { ...data, deletedAt: new Date().toISOString() }, ["proof/" + id]: pw });
    closeForm(); toast("지웠다냥 (아래 ‘최근 지운 항목’에서 되살릴 수 있어요)");
  } catch (err) { failed(err); }
};
function restore(x) {
  needUnlock(async () => {
    const { id, deletedAt, ...data } = x;
    try {
      await store.write({ ["events/" + id]: { ...data, updatedAt: new Date().toISOString() }, ["trash/" + id]: null, ["proof/" + id]: pw });
      toast("되살렸다냥!");
    } catch (err) { failed(err); }
  });
}
$("cancelBtn").onclick = closeForm;
$("veil").addEventListener("click", (e) => { if (e.target === $("veil")) closeForm(); });
$("lockVeil").addEventListener("click", (e) => { if (e.target === $("lockVeil")) $("lockCancel").onclick(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("veil").hidden) closeForm();
  if (!$("lockVeil").hidden) $("lockCancel").onclick();
});
$("addBtn").onclick = () => edit(null);

// ---------------------------------------------------------------------
// 밝게/어둡게
// ---------------------------------------------------------------------
const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : darkMQ.matches; }
function paintThemeBtn() {
  const d = isDark(), b = $("themeBtn");
  b.querySelector(".ico").textContent = d ? "☀️" : "🌙";
  b.querySelector(".txt").textContent = d ? "밝게" : "어둡게";
  b.setAttribute("aria-label", d ? "밝은 화면으로 바꾸기" : "어두운 화면으로 바꾸기");
}
{ const saved = lsGet("theme"); if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved; }
$("themeBtn").onclick = () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  lsSet("theme", next);
  paintThemeBtn();
};
darkMQ.addEventListener?.("change", paintThemeBtn);

// ---------------------------------------------------------------------
// 시작
// ---------------------------------------------------------------------
paintThemeBtn();
paintLock();
buildKinds();
$("demoNote").hidden = hasConfig;
render();
setInterval(render, 60000);   // 자정이 지나면 숫자가 바뀌도록
setInterval(tick, 1000);      // 특별한 날 카드의 초 단위 카운트다운

if (pw || !hasConfig) startListening();
else { showLocked(); needUnlock(() => {}); }
</script>
</body>
</html>
